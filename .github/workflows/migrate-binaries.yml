      - name: Commit migrated binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/references/sprites docs/media/videos/gemini_generated_video_7a1daa7c.mp4

          if git diff --cached --quiet; then
            echo "No binary changes needed."
            exit 0
          fi

          git commit -m "assets: complete binary migration [skip ci]"
          git push origin HEAD:chatgpt/migrate-project-r
