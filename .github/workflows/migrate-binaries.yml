name: Temporary binary migration

on:
  push:
    branches:
      - chatgpt/migrate-project-r
    paths:
      - ".github/workflows/migrate-binaries.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/migrate-project-r
          fetch-depth: 1

      - name: Download and verify binaries from old repository
        shell: bash
        run: |
          set -euo pipefail

          download_checked() {
            source_url="$1"
            target_path="$2"
            expected_size="$3"

            mkdir -p "$(dirname "$target_path")"
            curl --fail --location --retry 4 --retry-delay 2 "$source_url" --output "$target_path"

            actual_size="$(wc -c < "$target_path" | tr -d ' ')"
            if [ "$actual_size" != "$expected_size" ]; then
              echo "Size mismatch for $target_path: expected $expected_size, got $actual_size"
              exit 1
            fi
          }

          download_checked 'https://raw.githubusercontent.com/MarcosPaulodaSilva/Projeto-R/main/docs/references/sprites/castelo-morigan/castelo-morigan_referencia_01_img-1-out.-2026,-01_19_48.png' 'docs/references/sprites/castelo-morigan/castelo-morigan_referencia_01_img-1-out.-2026,-01_19_48.png' '725611'
